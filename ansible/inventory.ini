# Welche Maschinen Ansible per SSH verwaltet (IPs = dnsmasq-Reservierungen)
[pworkers]
pworker1 ansible_host=192.168.100.31
pworker2 ansible_host=192.168.100.32
pworker3 ansible_host=192.168.100.33

[lb]
ptraefik ansible_host=192.168.100.41

# Gruppe aller Podman-VMs = Worker + Load Balancer (lb)
[podman:children]
pworkers
lb

[podman:vars]
ansible_user=kuba
ansible_python_interpreter=/usr/bin/python3
